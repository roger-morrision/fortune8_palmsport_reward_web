name: Develop CI & Deploy (Staging)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  ci:
    name: Type-check · Test · Build · Deploy (Staging)
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_ENVIRONMENT: ${{ secrets.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_WEBSOCKET_URL: ${{ secrets.EXPO_PUBLIC_API_WEBSOCKET_URL }}
      EXPO_PUBLIC_AUTH_USERNAME: ${{ secrets.EXPO_PUBLIC_AUTH_USERNAME }}
      EXPO_PUBLIC_AUTH_PASSWORD: ${{ secrets.EXPO_PUBLIC_AUTH_PASSWORD }}
      EXPO_PUBLIC_PARTNER_ID: ${{ secrets.EXPO_PUBLIC_PARTNER_ID }}
      EXPO_PUBLIC_CDN_URL: ${{ secrets.EXPO_PUBLIC_CDN_URL }}
      EXPO_PUBLIC_FB_APP_ID: ${{ secrets.EXPO_PUBLIC_FB_APP_ID }}
      EXPO_PUBLIC_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_WEB_CLIENT_ID }}
      EXPO_PUBLIC_PALMSPLAY_GAME_URL: ${{ secrets.EXPO_PUBLIC_PALMSPLAY_GAME_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          printf '%s\n' \
            "EXPO_PUBLIC_ENVIRONMENT=${EXPO_PUBLIC_ENVIRONMENT}" \
            "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}" \
            "EXPO_PUBLIC_API_WEBSOCKET_URL=${EXPO_PUBLIC_API_WEBSOCKET_URL}" \
            "EXPO_PUBLIC_AUTH_USERNAME=${EXPO_PUBLIC_AUTH_USERNAME}" \
            "EXPO_PUBLIC_AUTH_PASSWORD=${EXPO_PUBLIC_AUTH_PASSWORD}" \
            "EXPO_PUBLIC_PARTNER_ID=${EXPO_PUBLIC_PARTNER_ID}" \
            "EXPO_PUBLIC_CDN_URL=${EXPO_PUBLIC_CDN_URL}" \
            "EXPO_PUBLIC_FB_APP_ID=${EXPO_PUBLIC_FB_APP_ID}" \
            "EXPO_PUBLIC_WEB_CLIENT_ID=${EXPO_PUBLIC_WEB_CLIENT_ID}" \
            "EXPO_PUBLIC_PALMSPLAY_GAME_URL=${EXPO_PUBLIC_PALMSPLAY_GAME_URL}" \
            > .env

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build web (expo export)
        run: npx expo export --platform web

      # ── Deploy to staging server via SSH ──────────────────────────────────
      # Required secrets (Settings → Secrets and variables → Actions):
      #   DEPLOY_SSH_KEY  — private key whose public key is in authorized_keys on staging server
      #   DEPLOY_HOST     — staging server IP or hostname
      #   DEPLOY_USER     — SSH user
      #   DEPLOY_PATH     — web root on staging server, e.g. "/var/www/staging"
      - name: Deploy to staging via SSH
        if: github.event_name == 'push'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo systemctl reload nginx"
